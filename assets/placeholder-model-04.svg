<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0f0f10" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ed2024" />
      <stop offset="100%" stop-color="#b81418" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="760" height="760" rx="24" fill="none" stroke="#27272a" stroke-width="2" />
  <rect x="30" y="30" width="740" height="740" rx="16" fill="none" stroke="#ed2024" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Top Badge -->
  <g transform="translate(400, 100)">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#ed2024" />
    <text text-anchor="middle" y="6" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" letter-spacing="3">BALLQISH SHOES SIDOARJO</text>
  </g>

  <!-- Number Circle -->
  <g transform="translate(400, 220)">
    <circle r="60" fill="#27272a" stroke="#ed2024" stroke-width="3" />
    <text text-anchor="middle" y="16" fill="#ffffff" font-family="'Playfair Display', serif" font-size="48" font-weight="700">04</text>
  </g>

  <!-- Center Shoe Silhouette -->
  <g transform="translate(400, 420)">
    <!-- Shadow -->
    <ellipse cx="0" cy="100" rx="200" ry="24" fill="#000000" opacity="0.6" />
    
    <!-- Silhouette Pantofel -->
    <path d="M-180,60 C-170,20 -130,-10 -70,-15 C-20,-20 30,-50 110,-55 C160,-58 200,-35 220,-5 C235,15 240,40 230,65 C220,80 180,85 100,85 C-30,85 -100,80 -150,80 C-180,80 -185,75 -180,60 Z" fill="#27272a" stroke="#3f3f46" stroke-width="3" />
    <!-- Heel & Sole -->
    <path d="M-180,65 L-140,65 L-140,88 L-175,88 Z" fill="#ed2024" opacity="0.9" />
    <path d="M-130,80 L210,80 L220,72 L210,88 L-130,88 Z" fill="#3f3f46" />
    
    <!-- Stitching line -->
    <path d="M-60,0 C-10,-5 40,-35 110,-40 C150,-42 180,-25 200,0" fill="none" stroke="#ed2024" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.8" />

    <!-- Camera Icon -->
    <circle cx="0" cy="20" r="34" fill="#ed2024" />
    <path d="M-14,26 L14,26 C16,26 18,24 18,22 L18,14 C18,12 16,10 14,10 L9,10 L7,7 L-7,7 L-9,10 L-14,10 C-16,10 -18,12 -18,14 L-18,22 C-18,24 -16,26 -14,26 Z" fill="#ffffff" />
    <circle cx="0" cy="18" r="5" fill="#ffffff" />
  </g>

  <!-- Model Title & Instruction Box -->
  <g transform="translate(400, 600)">
    <text text-anchor="middle" y="0" fill="#ffffff" font-family="'Playfair Display', serif" font-size="28" font-weight="700">Model 04 - Pantofel Double Monkstrap</text>
    <text text-anchor="middle" y="32" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" letter-spacing="1">Kode Ref: G80-MNK</text>

    <!-- Folder Pill -->
    <rect x="-240" y="65" width="480" height="52" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1.5" />
    <text text-anchor="middle" y="98" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">
      📁 Letakkan Foto di: foto produk/model-04/
    </text>

    <text text-anchor="middle" y="146" fill="#71717a" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
      Beri nama file: <tspan fill="#ffffff" font-weight="700">foto-1.jpg</tspan> (atau foto-1.png)
    </text>
  </g>
</svg>